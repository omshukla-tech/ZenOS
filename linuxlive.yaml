# ZenOs, made with the linuxlive.com wizard on 2026-10-27.
# Build it in your own GitHub from https://github.com/Eric-Ness/linuxlive-distro (see README.md)
schema_version: 1
name: "ZenOs"
version: "1.00"
base: ubuntu
desktop: kde
apps:
  - vscode
  - chromium
  - firefox
flathub:
  - com.jetbrains.PyCharm-Professional
  - io.github.shiftey.Desktop
  - com.getpostman.Postman
  - com.jgraph.drawio.desktop
  - md.obsidian.Obsidian
arches: [amd64, arm64]
branding:
  wallpaper: assets/wallpaper.png
  logo: assets/logo.png
  accent_color: "#b4a59c"
settings:
  autologin: true
  dock:
    - vscode
    - chromium
    - io.github.shiftey.Desktop
    - com.getpostman.Postman
    - com.jgraph.drawio.desktop
firefox:
  homepage: "https://www.google.com"
  bookmarks:
    - name: "Google"
      url: "https://www.google.com"
# Your own additions. Scripts and repos run as root; read them before you share the distro.
packages:
  - htop
  - vim
  - curl
  - wget
  - git
  - fastfetch
  - unzip
  - zip
